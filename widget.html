<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing — виджет для OBS</title>
<style>
  /* ===== значения по умолчанию; всё переопределяется через ?param=... ===== */
  :root{
    --accent:  #ff00a0;
    --accent2: #f09000;
    --bg:      #050a0c;
    --bg-a:    .90;
    --text:    #f6f2ec;
    --mute:    rgba(246,242,236,.52);
    --radius:  2px;
    --w:       764px;
    --pad:     10px 18px 10px 10px;
    --gap:     16px;
    --art-size:96px;
    --title:   24px;
    --sub:     13px;
    --cap:     10px;
    --font: "Bahnschrift","Segoe UI Semibold","Segoe UI",Arial,sans-serif;
    --mono: Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow:hidden;background:transparent;
    font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}

  /* холст 1920x1080, масштабируется под размер источника */
  #fit{position:absolute;top:0;left:0;width:1920px;height:1080px;
       transform-origin:top left;transform:scale(1)}

  .np{
    position:absolute;
    display:flex;align-items:center;gap:var(--gap);
    width:auto;max-width:var(--w);min-width:340px;
    padding:var(--pad);
    background:rgba(var(--bg-rgb),var(--bg-a));
    border:1px solid rgba(255,255,255,.07);
    border-left:3px solid var(--accent);
    border-radius:var(--radius);
    box-shadow:0 16px 50px rgba(0,0,0,.55);
    opacity:0;
    transition:opacity .45s ease, transform .45s ease;
    pointer-events:none;
  }
  .np.on{opacity:1}

  /* ---- позиции ---- */
  .p-top   {left:50%;top:46px;    transform:translateX(-50%) translateY(-8px)}
  .p-bottom{left:50%;bottom:44px; transform:translateX(-50%) translateY(8px)}
  .p-tl{left:48px;top:46px}
  .p-tr{right:48px;top:46px}
  .p-bl{left:48px;bottom:44px}
  .p-br{right:48px;bottom:44px}
  .np.on.p-top,
  .np.on.p-bottom{transform:translateX(-50%) translateY(0)}
  .np.on.p-tl,.np.on.p-tr,.np.on.p-bl,.np.on.p-br{transform:none}

  /* ---- стили ---- */
  .s-plain{border:none;border-left:3px solid var(--accent);background:transparent;
           box-shadow:none;backdrop-filter:none;padding-left:14px}
  .s-glass{background:rgba(var(--bg-rgb),.42);backdrop-filter:blur(14px) saturate(140%);
           border:1px solid rgba(255,255,255,.16)}
  .s-strip{border:none;border-radius:0;background:rgba(var(--bg-rgb),var(--bg-a));
           box-shadow:none;border-bottom:2px solid var(--accent);width:var(--w);max-width:none}

  .art{
    width:var(--art-size);height:var(--art-size);flex:0 0 var(--art-size);
    border-radius:var(--radius);overflow:hidden;background:#0a1113;
    border:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
  }
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art .ph{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:rgba(246,242,236,.25)}
  .no-art .art{display:none}

  .col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:10px}
  .cap{font-family:var(--mono);font-size:var(--cap);letter-spacing:.34em;
       color:var(--accent2);white-space:nowrap;text-transform:uppercase}

  .eq{display:flex;align-items:flex-end;gap:3px;height:13px}
  .eq i{display:block;width:3px;background:var(--accent);border-radius:1px;height:4px;
        animation:bar 900ms ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:120ms;opacity:.85}
  .eq i:nth-child(3){animation-delay:240ms}
  .eq i:nth-child(4){animation-delay:360ms;opacity:.7}
  @keyframes bar{0%,100%{height:3px}50%{height:13px}}
  .paused .eq i{animation-play-state:paused;height:4px}
  .no-eq .eq{display:none}

  .title{font-size:var(--title);font-weight:600;letter-spacing:.01em;line-height:1.12;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         text-shadow:0 2px 16px rgba(0,0,0,.7)}
  .row2{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .artist{font-family:var(--mono);font-size:var(--sub);letter-spacing:.09em;color:var(--mute);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
      color:rgba(246,242,236,.4);font-variant-numeric:tabular-nums;white-space:nowrap}
  .no-time .tm{display:none}

  .prog{position:relative;height:3px;background:rgba(255,255,255,.13);overflow:hidden}
  .prog i{position:absolute;left:0;top:0;bottom:0;width:0%;
          background:linear-gradient(90deg,var(--accent),var(--accent2));
          transition:width .25s linear}
  .no-progress .prog{display:none}
  .no-dur .prog,.no-dur .tm{display:none}
  .no-cap .row:first-child{display:none}
</style>
</head>
<body>
<div id="fit">
  <div class="np" id="np">
    <div class="art" id="art"><span class="ph">ART</span></div>
    <div class="col">
      <div class="row">
        <div class="eq"><i></i><i></i><i></i><i></i></div>
        <div class="cap" id="cap">Сейчас играет</div>
      </div>
      <div class="title" id="title">—</div>
      <div class="row2">
        <div class="artist" id="artist"></div>
        <div class="tm" id="tm"></div>
      </div>
      <div class="prog"><i id="bar"></i></div>
    </div>
  </div>
</div>

<script>
/* ================= параметры URL =================
   accent, accent2, bg, bgalpha, text, radius, w, pos, style,
   art, eq, progress, time, album, cap, title, sub, font
   ================================================= */
const P = new URLSearchParams(location.search);
const get = (k, d) => (P.has(k) && P.get(k) !== "" ? P.get(k) : d);
const num = (k, d) => { const v = parseFloat(get(k, d)); return isFinite(v) ? v : d; };
const on  = (k, d) => String(get(k, d)).toLowerCase() !== "0" &&
                      String(get(k, d)).toLowerCase() !== "false" &&
                      String(get(k, d)).toLowerCase() !== "off";

const hex = (v, d) => { v = (v || "").trim().replace(/^#/, "");
  return /^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v) ? "#" + v : d; };

const root = document.documentElement.style;
root.setProperty("--accent",  hex(get("accent",  "ff00a0"), "#ff00a0"));
root.setProperty("--accent2", hex(get("accent2", "f09000"), "#f09000"));
const bgHex = hex(get("bg", "050a0c"), "#050a0c");
const rgb = [1,3,5].map(i => parseInt(bgHex.substr(i,2), 16)).join(",");
root.setProperty("--bg-rgb", rgb);
root.setProperty("--bg-a",  String(Math.max(0, Math.min(1, num("bgalpha", 90) / 100))));
root.setProperty("--text",   hex(get("text", "f6f2ec"), "#f6f2ec"));
root.setProperty("--radius", num("radius", 2) + "px");
root.setProperty("--w",      num("w", 764) + "px");
root.setProperty("--title",  num("title", 24) + "px");
root.setProperty("--sub",    num("sub", 13) + "px");
const capSize = get("capsize", "");
if (capSize) root.setProperty("--cap", (parseFloat(capSize) || 10) + "px");

const styleName = String(get("style", "card")).toLowerCase();
const posName   = String(get("pos", "top")).toLowerCase();

const np = document.getElementById("np");
np.className = np.className.replace(/\bp-(top|bottom|tl|tr|bl|br)\b/g, "").trim();
np.classList.add("p-" + (["top","bottom","tl","tr","bl","br"].includes(posName) ? posName : "top"));
if (["plain","glass","strip"].includes(styleName)) np.classList.add("s-" + styleName);
if (!on("art", 1))      np.classList.add("no-art");
if (!on("eq", 1))       np.classList.add("no-eq");
if (!on("progress", 1)) np.classList.add("no-progress");
if (!on("time", 1))     np.classList.add("no-time");
if (!on("cap", 1))      np.classList.add("no-cap");

const capText = get("label", "");
if (capText) document.getElementById("cap").textContent = capText;

const showAlbum = on("album", 1);

/* ================= масштаб под размер источника ================= */
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("fit").style.transform = "scale(" + s + ")";
}
addEventListener("resize", fit); fit();

/* ================= данные ================= */
const API  = get("api", "/api/state");
const POLL = num("poll", 800);
const DEMO = P.has("demo") && P.get("demo") !== "0";

const el = {
  np, art: document.getElementById("art"),
  title: document.getElementById("title"),
  artist: document.getElementById("artist"),
  bar: document.getElementById("bar"),
  tm: document.getElementById("tm")
};

const fmt = s => { s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

let cur = { pos: 0, dur: 0, playing: false, at: performance.now() };
let artVer = -1;

function render(d){
  el.np.classList.toggle("on", !!d.title);
  el.np.classList.toggle("paused", !d.playing);
  el.np.classList.toggle("no-dur", !(d.dur > 0));

  if (d.title) el.title.textContent = d.title;
  el.artist.textContent = [d.artist, showAlbum ? d.album : ""].filter(Boolean).join(" · ");

  if (d.art && d.art !== artVer){
    artVer = d.art;
    el.art.innerHTML = '<img src="/api/art?v=' + d.art + '" alt="">';
  } else if (!d.art && artVer !== 0){
    artVer = 0;
    el.art.innerHTML = '<span class="ph">ART</span>';
  }

  cur = { pos: d.pos || 0, dur: d.dur || 0, playing: !!d.playing, at: performance.now() };
  paint();
}

function paint(){
  let p = cur.pos;
  if (cur.playing) p += (performance.now() - cur.at) / 1000;
  if (cur.dur) p = Math.min(p, cur.dur);
  el.bar.style.width = (cur.dur ? Math.max(0, Math.min(100, (p / cur.dur) * 100)) : 0) + "%";
  el.tm.textContent = cur.dur ? fmt(p) + " / " + fmt(cur.dur) : "";
}
setInterval(paint, 250);

const DEMO_DATA = [
  { title:"Кукла колдуна", artist:"Король и Шут", album:"Акустический альбом",
    playing:true, pos:42, dur:214, art:0 },
  { title:"Песня без слов", artist:"Кино", album:"Звезда по имени Солнце",
    playing:true, pos:88, dur:307, art:0 }
];

async function tick(){
  try{
    if (DEMO){
      const i = Math.floor(Date.now() / 4000) % DEMO_DATA.length;
      render(DEMO_DATA[i]);
      return;
    }
    const r = await fetch(API + "?t=" + Date.now(), { cache:"no-store" });
    render(await r.json());
  }catch(e){
    el.np.classList.remove("on");
  }
}
tick(); setInterval(tick, POLL);
</script>
</body>
</html>
